name: Deploy Wired Wizards to wiredwizards.co.ke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend & Backend + Deploy to wiredwizards.co.ke
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install & Build React Frontend (Production)
        working-directory: ./frontend
        env:
          # Points production frontend to https://wiredwizards.co.ke/api/v1 unless overridden in GitHub Secrets
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://wiredwizards.co.ke/api/v1' }}
        run: |
          npm ci
          npm run build

      - name: 4. Setup PHP 8.3 & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_pgsql, pgsql, gd, zip
          coverage: none

      - name: 5. Install Laravel Production Composer Dependencies
        working-directory: ./backend
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: 6. Assemble Unified Production Bundle (dist_deploy)
        run: |
          mkdir -p dist_deploy/backend
          mkdir -p dist_deploy/public_html

          # Copy backend application (excluding local storage/tests)
          rsync -a --exclude='.git' --exclude='tests' --exclude='node_modules' backend/ dist_deploy/backend/

          # Copy built React SPA into public_html
          cp -r frontend/dist/* dist_deploy/public_html/

          # Copy Laravel public/index.php & storage/images into public_html so /api/v1 & SPA share wiredwizards.co.ke
          cp -r backend/public/images dist_deploy/public_html/ 2>/dev/null || true

      # =========================================================================
      # OPTION A: Deploy via SSH + Rsync (VPS / Cloud / cPanel with SSH enabled)
      # Runs automatically when SSH_HOST and SSH_PRIVATE_KEY secrets are configured
      # =========================================================================
      - name: 7A. Deploy via SSH to wiredwizards.co.ke
        if: ${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || '22' }}
          SOURCE: "dist_deploy/"
          TARGET: ${{ secrets.REMOTE_TARGET_DIR || '/var/www/wiredwizards.co.ke/' }}
          ARGS: "-rlgoDzvc -i"

      - name: 7B. Run Post-Deploy Laravel Migrations & Cache on Server (SSH)
        if: ${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.REMOTE_TARGET_DIR || '/var/www/wiredwizards.co.ke' }}/backend
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      # =========================================================================
      # OPTION B: Deploy via FTP / FTPS (Standard cPanel Shared Hosting)
      # Runs automatically when FTP_SERVER, FTP_USERNAME & FTP_PASSWORD are set
      # =========================================================================
      - name: 8. Deploy React Storefront & ERP to public_html via FTP
        if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist_deploy/public_html/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR || '/public_html/' }}
