name: Deploy Wired Wizards to wiredwizards.co.ke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend & Backend + Deploy to wiredwizards.co.ke
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install & Build React Frontend (Production)
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://wiredwizards.co.ke/api/v1
        run: |
          npm ci
          npm run build

      - name: 4. Setup PHP 8.3 (Matches wiredwizards.co.ke ea-php83)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: 5. Install Laravel Production Dependencies
        working-directory: ./backend
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          cp .env.example .env
          sed -i 's|APP_ENV=.*|APP_ENV=production|g' .env
          sed -i 's|APP_DEBUG=.*|APP_DEBUG=false|g' .env
          sed -i 's|APP_URL=.*|APP_URL=https://wiredwizards.co.ke|g' .env
          sed -i 's|DB_CONNECTION=.*|DB_CONNECTION=pgsql|g' .env
          sed -i 's|DB_HOST=.*|DB_HOST=127.0.0.1|g' .env
          sed -i 's|DB_PORT=.*|DB_PORT=5432|g' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=wiredwiz_db|g' .env
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=wiredwiz_Willy|g' .env
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD='\''William#20'\''|g' .env
          echo "FRONTEND_URL=https://wiredwizards.co.ke" >> .env
          php artisan key:generate --force
          chmod -R 775 storage bootstrap/cache database

      - name: 6. Assemble & Zip Full-Stack Bundle (payload.zip)
        run: |
          mkdir -p dist_deploy/laravel_core

          # 1. Copy built React SPA (index.html, assets, .htaccess, logo.jpeg) into web root
          cp -r frontend/dist/* dist_deploy/
          cp frontend/public/.htaccess dist_deploy/.htaccess

          # 2. Copy Laravel Backend (including pre-seeded database & .env) into dist_deploy/laravel_core/
          rsync -a --exclude='.git' --exclude='tests' --exclude='node_modules' backend/ dist_deploy/laravel_core/
          cp database_exports/wired_wizards_postgres_dump.sql dist_deploy/laravel_core/database/wired_wizards_postgres_dump.sql

          # 3. Protect laravel_core/ from direct public web access
          printf "<IfModule mod_authz_core.c>\n  Require all denied\n</IfModule>\n<IfModule !mod_authz_core.c>\n  Order deny,allow\n  Deny from all\n</IfModule>\n" > dist_deploy/laravel_core/.htaccess

          # 4. Create api_entry.php in web root to boot Laravel for /api/v1/* requests
          printf "<?php\nuse Illuminate\Http\Request;\ndefine('LARAVEL_START', microtime(true));\nif (file_exists(\$maintenance = __DIR__.'/laravel_core/storage/framework/maintenance.php')) {\n    require \$maintenance;\n}\nrequire __DIR__.'/laravel_core/vendor/autoload.php';\n\$app = require_once __DIR__.'/laravel_core/bootstrap/app.php';\n\$app->handleRequest(Request::capture());\n" > dist_deploy/api_entry.php

          # 5. Zip entire dist_deploy into single archive for atomic 3-second FTP transfer
          cd dist_deploy && zip -rq ../payload.zip . .htaccess && cd ..

          # 6. Create atomic server unpacker script
          printf '<?php\n$envPath = __DIR__ . "/laravel_core/.env";\n$envBackup = file_exists($envPath) ? file_get_contents($envPath) : null;\n$zip = new ZipArchive();\nif ($zip->open(__DIR__ . "/payload.zip") === true) {\n    $zip->extractTo(__DIR__);\n    $zip->close();\n    if ($envBackup !== null && strpos($envBackup, "wiredwiz_db") !== false) { file_put_contents($envPath, $envBackup); }\n    @unlink(__DIR__ . "/payload.zip");\n    @unlink(__FILE__);\n    echo json_encode(["status" => "deployed_successfully", "php" => PHP_VERSION]);\n} else {\n    http_response_code(500);\n    echo json_encode(["status" => "zip_open_failed"]);\n}\n' > _unpack.php

      - name: 7. Upload & Extract Atomic Release on wiredwizards.co.ke
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --ftp-pasv --retry 3 -u "$FTP_USER:$FTP_PASS" -T frontend/public/.htaccess "ftp://$FTP_HOST/.htaccess"
          curl --ftp-pasv --retry 3 -u "$FTP_USER:$FTP_PASS" -T payload.zip "ftp://$FTP_HOST/payload.zip"
          curl --ftp-pasv --retry 3 -u "$FTP_USER:$FTP_PASS" -T _unpack.php "ftp://$FTP_HOST/_unpack.php"
          curl -f -sS "https://wiredwizards.co.ke/_unpack.php"
