name: Deploy Wired Wizards to wiredwizards.co.ke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend & Backend + Deploy to wiredwizards.co.ke
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install & Build React Frontend (Production)
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://wiredwizards.co.ke/api/v1' }}
        run: |
          npm ci
          npm run build

      - name: 4. Setup PHP 8.3 & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_pgsql, pgsql, gd, zip
          coverage: none

      - name: 5. Install Laravel Production Composer Dependencies
        working-directory: ./backend
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: 6. Assemble Unified Full-Stack Web Root Bundle (dist_deploy)
        run: |
          mkdir -p dist_deploy/laravel_core

          # 1. Copy built React SPA (index.html, assets, .htaccess, logo.jpeg) into web root
          cp -r frontend/dist/* dist_deploy/
          cp frontend/public/.htaccess dist_deploy/.htaccess

          # 2. Copy Laravel Backend into dist_deploy/laravel_core/
          rsync -a --exclude='.git' --exclude='tests' --exclude='node_modules' backend/ dist_deploy/laravel_core/
          cp database_exports/wired_wizards_postgres_dump.sql dist_deploy/laravel_core/database/wired_wizards_postgres_dump.sql

          # 3. Protect laravel_core/ from direct public web access
          cat << 'EOF' > dist_deploy/laravel_core/.htaccess
          <IfModule mod_authz_core.c>
            Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
            Order deny,allow
            Deny from all
          </IfModule>
          EOF

          # 4. Create api_entry.php in web root to boot Laravel for /api/v1/* requests
          cat << 'EOF' > dist_deploy/api_entry.php
          <?php
          use Illuminate\Http\Request;
          define('LARAVEL_START', microtime(true));
          if (file_exists($maintenance = __DIR__.'/laravel_core/storage/framework/maintenance.php')) {
              require $maintenance;
          }
          require __DIR__.'/laravel_core/vendor/autoload.php';
          $app = require_once __DIR__.'/laravel_core/bootstrap/app.php';
          $app->handleRequest(Request::capture());
          EOF

      - name: 7. Deploy Unified Bundle to wiredwizards.co.ke via FTP
        if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist_deploy/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            laravel_core/.env
